<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Royal Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Gold Seal Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Architectural Blueprint Glow -->
    <linearGradient id="blueprintGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Shield Crest -->
  <path d="M 200 24 C 290 24 350 44 350 96 C 350 220 280 326 200 368 C 120 326 50 220 50 96 C 50 44 110 24 200 24 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#accentGrad)" 
        stroke-width="6" 
        filter="url(#logoShadow)" />

  <!-- Inner Crest Border -->
  <path d="M 200 38 C 280 38 334 56 334 102 C 334 212 272 308 200 348 C 128 308 66 212 66 102 C 66 56 120 38 200 38 Z" 
        stroke="#334155" 
        stroke-width="2" 
        stroke-dasharray="4 4" 
        fill="none" />

  <!-- Subtle Blueprint Tech Grid in Crest -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="1">
    <line x1="100" y1="100" x2="300" y2="100" />
    <line x1="80" y1="150" x2="320" y2="150" />
    <line x1="80" y1="200" x2="320" y2="200" />
    <line x1="100" y1="250" x2="300" y2="250" />
    <line x1="140" y1="60" x2="140" y2="300" />
    <line x1="200" y1="50" x2="200" y2="330" />
    <line x1="260" y1="60" x2="260" y2="300" />
  </g>

  <!-- Architectural Pediment / Triangle Roof -->
  <path d="M 120 148 L 200 86 L 280 148 Z" 
        fill="url(#blueprintGrad)" 
        stroke="#93c5fd" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Pediment Medallion / Star Seal -->
  <circle cx="200" cy="126" r="10" fill="url(#goldGrad)" />
  <polygon points="200,119 202.5,124 208,124 203.5,127.5 205.5,133 200,129.5 194.5,133 196.5,127.5 192,124 197.5,124" fill="#ffffff" />

  <!-- Classical Architrave Beam -->
  <rect x="114" y="148" width="172" height="12" rx="3" fill="#e2e8f0" stroke="#0f172a" stroke-width="2" />

  <!-- Classical Pillars (4 Columns) -->
  <rect x="132" y="160" width="18" height="66" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
  <line x1="141" y1="164" x2="141" y2="222" stroke="#cbd5e1" stroke-width="2" />
  
  <rect x="174" y="160" width="18" height="66" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
  <line x1="183" y1="164" x2="183" y2="222" stroke="#cbd5e1" stroke-width="2" />

  <rect x="208" y="160" width="18" height="66" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
  <line x1="217" y1="164" x2="217" y2="222" stroke="#cbd5e1" stroke-width="2" />

  <rect x="250" y="160" width="18" height="66" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
  <line x1="259" y1="164" x2="259" y2="222" stroke="#cbd5e1" stroke-width="2" />

  <!-- Base / Foundation Plinth -->
  <rect x="112" y="226" width="176" height="10" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
  <rect x="104" y="236" width="192" height="12" rx="3" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />

  <!-- Verified Digital Seal / Ribbon Badge -->
  <g transform="translate(200, 276)">
    <path d="M -54 8 L -72 26 L -50 20 L -30 24 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 54 8 L 72 26 L 50 20 L 30 24 Z" fill="url(#goldGrad)" opacity="0.9" />

    <circle cx="0" cy="0" r="28" fill="#1e3a8a" stroke="url(#goldGrad)" stroke-width="4" />
    <circle cx="0" cy="0" r="22" fill="#0f172a" />
    
    <path d="M -9 -1 L -3 5 L 11 -8" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Branding Acronym: BPMS -->
  <text x="200" y="324" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="20" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#f8fafc">
    BPMS
  </text>
</svg>
